[project]
name = "rag-for-blogs"
version = "1.0.0"
description = "RAG engine for personal blog posts with hybrid retrieval and streaming generation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104,<1.0",
    "uvicorn>=0.24,<1.0",
    "requests>=2.31,<3.0",
    "numpy>=1.24,<3.0",
    "faiss-cpu>=1.7,<2.0",
    "fastembed>=0.2,<1.0",
    "tqdm>=4.66,<5.0",
    "pydantic>=2.0,<3.0",
    "aiofiles>=23.0,<25.0",
    "groq>=0.4,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "ingestion", "embeddings", "retrieval", "generation", "eval"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that load ML models (deselect with '-m \"not slow\"')",
]
